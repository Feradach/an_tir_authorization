{% if password_errors %}
    <div class="alert alert-danger" role="alert">
        <ul class="mb-0">
            {% for error in password_errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
<div id="password-requirements">
    <p class="fw-semibold mb-1">Password requirements</p>
    <ul>
        {% for requirement in password_requirements %}
            <li>{{ requirement }}</li>
        {% endfor %}
    </ul>
    <p><a href="{% url 'common_passwords' %}">Read the list of common passwords</a></p>
</div>
